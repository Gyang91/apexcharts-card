name: HACS Validation

on:
  push:
    branches: [main]
  # No pull_request trigger: HACS validates the published release asset, which
  # a pull request branch never has, so those runs could only fail.
  # Release commits are validated once the asset is uploaded (Release workflow done).
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip release commits on push: the asset is not attached yet, so HACS would fail.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
