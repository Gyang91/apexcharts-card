name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approve the release pull request's checks
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.auto-release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.auto-release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.auto-release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release without a manual merge: when release-please opened or updated
      # its pull request, test that branch, merge it, and run release-please
      # again to tag the release. A merge made with GITHUB_TOKEN starts no new
      # workflow run, so tagging has to happen in this one.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Test the release branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          npm ci
          npm test
          npm run build
      # Checks on a pull request opened by github-actions[bot] wait for approval
      # and would expire as failed once it is merged: approve them so they run.
      - name: Approve the release pull request's checks
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs?branch=$BRANCH&status=action_required" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" || echo "Could not approve run $id"
          done
      - name: Merge the release pull request
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --squash --repo "${{ github.repository }}"
      - uses: googleapis/release-please-action@v5
        id: auto-release
        if: ${{ steps.release.outputs.pr }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build & upload asset
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist asset to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/apexcharts-card.js
