name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approve the release pull request's checks
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.auto-release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.auto-release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.auto-release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release without a manual merge: when release-please opened or updated
      # its pull request, test that branch, merge it, and run release-please
      # again to tag the release. A merge made with GITHUB_TOKEN starts no new
      # workflow run, so tagging has to happen in this one.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Test the release branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          npm ci
          npm test
          npm run build
          npm run check:bundle
      # Checks on a pull request opened by github-actions[bot] wait for approval
      # and would expire as failed once it is merged: approve them so they run,
      # then wait for every check on the pull request's head commit to pass
      # before merging. A failing check stops the release here.
      - name: Approve the release pull request's checks and wait for them
        id: checks
        if: ${{ steps.release.outputs.pr }}
        # env is evaluated even when the step is skipped: pass the raw output
        # and parse it in the script (fromJSON('') would fail every run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          NUMBER=$(jq -r .number <<<"$PR")
          SHA=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Runs can appear a little after the push: keep approving until the
          # CI run for this commit exists and no run still waits for approval.
          for attempt in $(seq 1 30); do
            PENDING=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=action_required" --jq '.workflow_runs[].id')
            for id in $PENDING; do
              gh api -X POST "repos/$REPO/actions/runs/$id/approve" || echo "Could not approve run $id"
            done
            CI_STATUS=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | first | .status // empty')
            if [ -z "$PENDING" ] && [ -n "$CI_STATUS" ] && [ "$CI_STATUS" != "action_required" ] && [ "$CI_STATUS" != "waiting" ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::No running CI for $SHA after 5 minutes (status: ${CI_STATUS:-none})"
              exit 1
            fi
            sleep 10
          done

          gh pr checks "$NUMBER" --repo "$REPO" --watch --interval 20 --fail-fast
      - name: Merge the release pull request
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        # --match-head-commit: merge only the commit whose checks passed.
        run: >-
          gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --squash
          --repo "${{ github.repository }}" --match-head-commit "${{ steps.checks.outputs.sha }}"
      - uses: googleapis/release-please-action@v5
        id: auto-release
        if: ${{ steps.release.outputs.pr }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build & upload asset
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist asset to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/apexcharts-card.js
